name: Notificaciones programadas

# Cada 5 minutos pide al sitio que envíe las notificaciones que ya tocaban.
# GitHub puede atrasar unos minutos las ejecuciones programadas.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enviar notificaciones pendientes
        run: curl -fsS -X POST --max-time 120 https://smartloyalty.app/api/cron/scheduled
