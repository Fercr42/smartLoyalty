name: Notificaciones programadas

# Cada 5 minutos pide al sitio que envíe las notificaciones que ya tocaban.
# GitHub puede atrasar unos minutos las ejecuciones programadas.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enviar notificaciones pendientes
        # CRON_SECRET: el mismo valor en Vercel y en Settings > Secrets > Actions de GitHub.
        run: |
          code=$(curl -sS -o respuesta.json -w "%{http_code}" -X POST --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://smartloyalty.app/api/cron/scheduled)
          if [ "$code" -ge 400 ]; then
            echo "::error::El sitio respondió $code: $(head -c 300 respuesta.json)"
            exit 1
          fi
