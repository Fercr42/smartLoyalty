name: Pruebas en producción

# Después de cada deploy de producción en Vercel (y a mano desde la pestaña Actions):
# prueba el sitio real con restaurantes "zzE2E…" que se borran al terminar.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Sitio a probar"
        default: "https://smartloyalty.app"

concurrency:
  group: e2e-production
  cancel-in-progress: false

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: smart-loyalty-dashboard
    env:
      E2E_BASE_URL: ${{ github.event.inputs.base_url || 'https://smartloyalty.app' }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: smart-loyalty-dashboard/package-lock.json
      - run: npm ci
      - name: Revisar credenciales
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] || [ -z "$NEXT_PUBLIC_FIREBASE_API_KEY" ]; then
            echo "::error::Falta el secreto FIREBASE_SERVICE_ACCOUNT o la variable NEXT_PUBLIC_FIREBASE_API_KEY en GitHub"
            exit 1
          fi
      - name: Pruebas contra el sitio publicado
        run: npm run test:e2e
