name: Diagnóstico producción
on:
  push:
    branches: [diag-prod]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probar versiones de vista previa
        run: |
          for pair in "71e7905 https://smart-loyalty-h1j7mrl0a-fernando-rodriguezs-projects-5769aba8.vercel.app" "3453276 https://smart-loyalty-29k7ayu3e-fernando-rodriguezs-projects-5769aba8.vercel.app"; do
            sha=${pair%% *}; base=${pair#* }
            code=$(curl -sS -o body.txt -w "%{http_code}" -X POST -H "Content-Type: application/json" -d '{"action":"login","companyId":"x"}' "$base/api/loyalty/staff")
            echo "::notice::$sha staff -> $code $(head -c 150 body.txt | tr '\n' ' ')"
          done
